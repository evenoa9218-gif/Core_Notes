# 노션 「로민정 단원」 → data-civil.js 자동 반영.
#
# 노션에서 단원을 고쳐 두면 매일 새벽에 알아서 반영된다. 급하면 GitHub 의
# Actions 탭에서 Run workflow 버튼을 누른다. 둘 다 Claude 토큰은 0이다.
#
# 사전 준비(한 번만): 저장소 Settings → Secrets and variables → Actions 에
# NOTION_TOKEN 시크릿을 등록한다.
name: notion-sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'   # 매일 05:00 KST

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # notion_raw 는 gitignore 라 캐시로 이어받는다. 캐시가 비면 전량을
      # 다시 받을 뿐이니(3분쯤) 없어도 동작은 같다.
      - uses: actions/cache@v4
        with:
          path: |
            tools/notion_raw
            tools/notion_raw_crim
            tools/notion_raw_minso
          key: notion-raw-${{ github.run_id }}
          restore-keys: notion-raw-

      - name: sync
        env:
          # 시크릿 이름을 NOTIONTOKEN 으로 등록해 둔 상태라 두 이름 다 받는다
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTIONTOKEN }}
        run: |
          python tools/sync_notion.py
          python tools/sync_crim.py
          python tools/verify_fidelity.py
          python tools/build_criminal.py
          python tools/sync_minso.py
          python tools/build_minso.py

      # 민법 본문의 기출 표시 → 사례형·기록형·선택형 문항 연결(data-examlinks.js).
      # 연결 열쇠가 「줄 내용」이라 노션에서 줄을 고치면 그 줄의 연결이 끊긴다 — 동기화할 때마다 다시 만든다.
      # 책 원문(tools/examlinks_sources.json)은 D 드라이브에서 미리 뽑아 커밋해 두었으니 여기선 필요 없다.
      - uses: actions/checkout@v4
        with: { repository: evenoa9218-gif/CASE_Practice, path: _ext/CASE_Practice }
      - uses: actions/checkout@v4
        with: { repository: evenoa9218-gif/RECORD_Practice, path: _ext/RECORD }
      - uses: actions/checkout@v4
        with: { repository: evenoa9218-gif/MCQ, path: _ext/MCQ }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: exam links
        env:
          CASE_DIR: _ext/CASE_Practice
          RECORD_DIR: _ext/RECORD
          MCQ_DIR: _ext/MCQ
        run: node tools/build_examlinks.js

      - name: commit & push
        run: |
          git config user.name "notion-sync"
          git config user.email "noreply@github.com"
          git add data-civil.js data-crim.js data-crimpro.js data-minso.js data-examlinks.js tools/examlinks_report.txt
          git diff --cached --quiet && echo "바뀐 것 없음" && exit 0
          git commit -m "sync: 노션 수정분 반영 (자동)"
          git push
