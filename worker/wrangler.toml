name = "core-notes-writer"
main = "src/index.js"
compatibility_date = "2026-07-01"

# 분당 쓰기 제한. 비밀번호가 있지만 엔드포인트 자체는 공개라,
# 새면 한 사람이 계속 호출해 저장소를 커밋으로 뒤덮을 수 있다.
[[unsafe.bindings]]
name = "WRITE_LIMIT"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# 토큰·비밀번호는 여기 적지 않는다. 배포한 뒤 아래로 넣는다:
#   npx wrangler secret put GH_TOKEN       GitHub fine-grained PAT (Core_Notes 의 Contents: write 만)
#   npx wrangler secret put APP_PASSWORD   앱에서 한 번 입력하는 비밀번호
